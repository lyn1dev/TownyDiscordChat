# Language for built-in messages: en, it, fr, es or pl. Missing keys fall back to English.
language: en

# Meridian fork: put every town and nation text channel in one category, made automatically. Discord allows 50
# channels per category, so when it's full a second one ("Towns & Nations 2") is made, and so on. Channels are named
# town-<name> and nation-<name>. When Shared is true the category ids below are ignored.
category:
  Shared: true
  Name: "Towns & Nations"

nation:
  CreateTextChannelForRole: true
  CreateVoiceChannelForRole: false

  UseCategoryForText: true
  UseCategoryForVoice: true

  TextCategoryId: 0
  VoiceCategoryId: 0

  CreateRoleIfNoneExists: true
  RoleCreateColorCode: "0xF2B84B"
town:
  CreateTextChannelForRole: true
  CreateVoiceChannelForRole: false

  UseCategoryForText: true
  UseCategoryForVoice: true

  TextCategoryId: 0
  VoiceCategoryId: 0

  CreateRoleIfNoneExists: true
  RoleCreateColorCode: "0x6CC456"
bridge:
  Enabled: true
  MinecraftToDiscord: true
  DiscordToMinecraft: true
  # Only messages meant for the town (or nation) go to its channel, never global or local chat.
  TownChatOnly: true
  NationChatOnly: true
  NationMinecraftFormat: "**%player%:** %message%"
  # %titolo% = the nation name, %usernameds% = the Discord name, %message% = the message.
  NationDiscordFormat: "&6[Nation] &9[Discord] &7%usernameds%&8: &f%message%"
  # Discord users must be linked and belong to the town whose channel they are using.
  RequireLinkedAccount: true
  RequireCurrentTown: true
  # Removes emoji and invisible Unicode markers that Minecraft's font shows as boxes.
  RemoveUnsupportedDiscordEmoji: true
  MinecraftFormat: "**%player%:** %message%"
  # %titolo% = the town name, %usernameds% = the Discord name, %message% = the message.
  DiscordFormat: "&a[Town] &9[Discord] &7%usernameds%&8: &f%message%"

# Settings the mayor or an assistant can change with /town discord newday|chat|jail enable|disable
townFeatures:
  Defaults:
    NewDay: true
    Chat: true
    Jail: true
  # Each town's own choices are saved here automatically.
  Towns: {}

# Detecting town/nation chat from TownyChat. Meridian's chat plugin hands messages over directly instead
# (see TDCApi), so this is off.
townychat:
  Enabled: false
  ChannelPlaceholder: "%townychat_channel_name%"
  TownChannelNames: ["town"]
  NationChannelNames: ["nation", "nc"]
  CommandListener:
    Enabled: false
    TownCommands: ["tc", "townchat", "town"]
    LocalCommands: ["l", "lc", "localchat", "local"]
    OtherCommands: ["g", "global", "globalchat", "a", "admin", "m", "mod"]
    NationCommands: ["nc", "nationchat", "nation"]
  LocalNoNearbyPlayersWarning:
    Enabled: false
    ChannelNames: ["local"]
    Radius: 100
    Message: "&cNobody is close enough to read that. Use &f/g&c to talk to everyone."
    Title: "&cNobody can hear you"
    Subtitle: "&7No player is close enough"
    TitleFadeIn: 10
    TitleStay: 50
    TitleFadeOut: 20
    SoundEnabled: true
    Sound: "BLOCK_NOTE_BLOCK_BELL"
    SoundVolume: 1.0
    SoundPitch: 1.0

discord:
  SlashCommands:
    Enabled: true
  TownButtons:
    # Members with any of these role ids can use the Taxes and Residents buttons in any town channel.
    AdminRoleIds: []
    # Members with the Discord Administrator permission can too.
    AllowDiscordAdministrators: true

# Optional Dynmap integration used by /town map. Meridian's web map isn't Dynmap, so this is off.
dynmap:
  Enabled: false
  WebUrl: "http://127.0.0.1:8123"
  MapPrefix: "flat"
  TileSize: 128
  TilesPerSide: 3
  Zoom: 0
  RequestTimeoutSeconds: 5
  TileUrlTemplate: "%web_url%/tiles/%world%/%map_prefix%/%chunk_x%_%chunk_y%/%zoom_prefix%%map_x%_%map_y%.png"
  MapX:
    WorldXMultiplier: 1.0
    WorldZMultiplier: 0.0
    Offset: 0.0
  MapY:
    WorldXMultiplier: 0.0
    WorldZMultiplier: 1.0
    Offset: 0.0

placeholderapi:
  # External PlaceholderAPI values can be used in configurable text.
  Enabled: true

# Items shown in town/nation chat. With the InteractiveChat DiscordSRV addon installed, town and nation chat goes
# through DiscordSRV so the addon renders [item], [inv] and the other placeholders as images.
interactivechat:
  Enabled: true
  UseDiscordSRVAddon: true
  MaxItemsPerMessage: 3
  ItemEmbed:
    Color: "#F5C83D"
    Title: "🧰 Item shown by %player%"
    Description: "%display_name%"
    Timestamp: false
    Footer:
      Text: "Meridian"
      IconUrl: ""
    Fields:
      Material:
        Name: "Item"
        Value: "`%item%`"
        Inline: true
      Amount:
        Name: "Amount"
        Value: "`%amount%`"
        Inline: true

channels:
  # Town names whose Discord channels were deliberately deleted by an admin.
  DisabledTowns: []

messages:
  TimeZone: "Europe/London"
  DateFormat: "dd/MM/yyyy - HH:mm"
  DiscordLogTextChannelId: 0

  Prefix: "&8[&6Discord&8]"

  # Posted in a town's new channel when the town is founded. %towny_message% is Towny's own message.
  TownCreated:
    Enabled: true
    Format: "🏙️ **Founded:** %towny_message%"

  # Posted in the main DiscordSRV channel at new day when a town goes bankrupt, falls into ruin or is deleted.
  # NPC residents are left out of names and counts.
  GlobalTownFallEmbed:
    Enabled: true
    Color: "#8B1E1E"
    Title: "The fall of %town% - %status%"
    Description: "%story%"
    Timestamp: true
    AmountFormat: "%.2f"
    CauseLabels:
      bankrupt: "Bankruptcy"
      ruined: "Ruin"
      fallen: "Fallen"
    Footer:
      Text: "Meridian · new day"
      IconUrl: ""
    Author:
      Name: ""
      Url: ""
      IconUrl: ""
    ThumbnailUrl: ""
    ImageUrl: ""
    Fields:
      Mayor:
        Name: "Last mayor"
        Value: "**%mayor%**"
        Inline: true
      Nation:
        Name: "Nation"
        Value: "%nation%"
        Inline: true
      Residents:
        Name: "Residents"
        Value: "`%residents%`"
        Inline: true
      Citizens:
        Name: "Remembered"
        Value: "%citizens%"
        Inline: false
      Economy:
        Name: "Last balance"
        Value: "`%balance%` - estimated value `%town_value%`"
        Inline: false
      Wealth:
        Name: "Residents' wealth"
        Value: "Total `%resident_wealth%` - average `%average_wealth%`"
        Inline: false
      Territory:
        Name: "Land and costs"
        Value: "`%plots%` chunks - tax `%tax%` - upkeep `%upkeep%`"
        Inline: false
    Variants:
      - "The bells of **%town%** have rung for the last time. Mayor **%mayor%** leaves behind a town of **%residents%** residents and **%plots%** chunks, while **%citizen_one%** and the rest watch the banner come down."
      - "At the new day the ledgers gave their verdict: **%town%** has fallen into **%status%**. Under **%mayor%** the bank reached `%balance%` against an upkeep of `%upkeep%`."
      - "Where **%town%** stood yesterday there are only quiet streets and unpaid bills. **%mayor%**, **%citizen_one%** and **%citizen_two%** leave history a town worth about `%town_value%`."
      - "The treasury couldn't last another day: **%town%** faces **%status%**. Its **%residents%** residents held `%resident_wealth%` between them, but the town bank stopped at `%balance%`."
      - "No war, just the weight of the numbers: **%town%** didn't make it through the new day. **%mayor%** leaves **%residents%** residents, **%citizen_one%** among them, without town walls."

  TownEvents:
    rank-add:
      Enabled: true
      Format: "Rank: %resident% is now %rank% (by %actor%)."
    rank-remove:
      Enabled: true
      Format: "Rank: %resident% is no longer %rank% (by %actor%)."
    taxes:
      Enabled: true
      Format: "Taxes: the town tax is now %tax% (by %actor%)."

  BankEmbed:
    Enabled: true
    Color: "#F5C83D"
    Title: "🏦 Town bank — %town%"
    Description: "A payment in or out of the town bank"
    Timestamp: true
    Footer:
      Text: "Meridian"
      IconUrl: ""
    Author:
      Name: ""
      Url: ""
      IconUrl: ""
    ThumbnailUrl: ""
    ImageUrl: ""
    AmountFormat: "%.2f"
    Buttons:
      Enabled: true
      TaxesLabel: "💰 Taxes"
      ResidentsLabel: "👥 Residents"
    Fields:
      Type:
        Name: "Type"
        Value: "`%type%`"
        Inline: true
      Amount:
        Name: "Amount"
        Value: "`%amount%`"
        Inline: true
      Balance:
        Name: "Balance"
        Value: "`%balance%`"
        Inline: true
      Actor:
        Name: "By"
        Value: "%actor%"
        Inline: false
      Reason:
        Name: "Reason"
        Value: "%reason%"
        Inline: false

  # Posted in the town's channel at every new day.
  DailySummaryEmbed:
    Enabled: true
    Color: "#6EC1FF"
    Title: "📊 Daily summary — %town%"
    Description: "Where the town stands today"
    Timestamp: true
    Footer:
      Text: "Meridian"
      IconUrl: ""
    Author:
      Name: ""
      Url: ""
      IconUrl: ""
    ThumbnailUrl: ""
    ImageUrl: ""
    AmountFormat: "%.2f"
    Fields:
      Mayor:
        Name: "Mayor"
        Value: "%mayor%"
        Inline: true
      Nation:
        Name: "Nation"
        Value: "%nation%"
        Inline: true
      Residents:
        Name: "Residents"
        Value: "%residents%"
        Inline: true
      Balance:
        Name: "Balance"
        Value: "`%balance%`"
        Inline: true
      Tax:
        Name: "Taxes"
        Value: "`%tax% %tax_mode%`"
        Inline: true
      Spawn:
        Name: "Town spawn"
        Value: "`%spawn_world%: %spawn_x%, %spawn_y%, %spawn_z%`"
        Inline: false

  # The Outposts button under the daily summary.
  OutpostsEmbed:
    Color: "#9B59B6"
    Title: "Outposts - %town%"
    Description: "%entries%"
    Timestamp: false
    Footer:
      Text: "Page %page%/%pages% - %outposts% outposts"
      IconUrl: ""
    PageSize: 10
    EntryFormat: "- **%outpost%** - group: **%group%** - `%world% %x%, %z%`"
    EmptyText: "No outposts."
    PreviousLabel: "Previous"
    NextLabel: "Next"

  # Buttons under the daily summary.
  DailySummaryButtons:
    Enabled: true
    TaxesLabel: "Taxes"
    ResidentsLabel: "Residents"
    OutpostsLabel: "Outposts"

  # Private reply to the Taxes button. Placeholders: %town%, %balance%, %upkeep%, %resident_tax%,
  # %resident_tax_mode%, %plot_tax%, %commercial_tax%, %embassy_tax%, %nation%, %nation_tax%.
  TaxDetailsEmbed:
    Color: "#F5C83D"
    Title: "💰 Taxes and upkeep — %town%"
    Description: "The town's daily money."
    Timestamp: true
    AmountFormat: "%.2f"
    Footer:
      Text: "Only you can see this"
      IconUrl: ""
    Fields:
      Balance:
        Name: "Balance"
        Value: "`%balance%`"
        Inline: true
      Upkeep:
        Name: "Daily upkeep"
        Value: "`%upkeep%`"
        Inline: true
      ResidentTax:
        Name: "Resident tax"
        Value: "`%resident_tax%` (%resident_tax_mode%)"
        Inline: true
      PlotTax:
        Name: "Plot tax"
        Value: "`%plot_tax%`"
        Inline: true
      CommercialTax:
        Name: "Shop plot tax"
        Value: "`%commercial_tax%`"
        Inline: true
      EmbassyTax:
        Name: "Embassy tax"
        Value: "`%embassy_tax%`"
        Inline: true
      NationTax:
        Name: "Nation tax — %nation%"
        Value: "`%nation_tax%`"
        Inline: true

  # Private, paged reply to the Residents button. EntryFormat also takes PlaceholderAPI values for each resident.
  ResidentsEmbed:
    Color: "#6CC456"
    Title: "👥 Residents — %town%"
    Description: "%entries%"
    Timestamp: false
    Footer:
      Text: "Page %page%/%pages% · %residents% residents"
      IconUrl: ""
    PageSize: 12
    EntryFormat: "• **%resident%** — %roles%\n  Last seen: %last_seen%"
    MayorLabel: "Mayor"
    ResidentLabel: "Resident"
    OnlineText: "🟢 Online now"
    NeverSeenText: "Never"
    LastSeenFormat: "<t:%timestamp%:F> (<t:%timestamp%:R>)"
    PreviousLabel: "◀ Previous"
    NextLabel: "Next ▶"

  Commands:
    PleaseWait: "&7Please wait..."
    NoPermission: "&7You don't have permission to use this command!"

  Role:
    DoNothing:
      Success: "&7Role change not required!"
      Failure: "&7Failed to do nothing!"
    Remove:
      Success: "&7Removed role!"
      Failure: "&7Failed to remove role!"
    Add:
      Success: "&7Added role!"
      Failure: "&7Failed to add role!"
    Create:
      Success: "&7Created role!"
      Failure: "&7Failed to create role!"
    Delete:
      Success: "&7Deleted role!"
      Failure: "&7Failed to delete role!"
    Rename:
      Success: "&7Renamed role!"
      Failure: "&7Failed to rename role!"

  TextChannel:
    DoNothing:
      Success: "&7TextChannel change not required!"
      Failure: "&7Failed to do nothing!"
    Remove:
      Success: "&7Removed TextChannel!"
      Failure: "&7Failed to remove TextChannel!"
    Add:
      Success: "&7Added TextChannel!"
      Failure: "&7Failed to add TextChannel!"
    Create:
      Success: "&7Created TextChannel!"
      Failure: "&7Failed to create TextChannel!"
    Delete:
      Success: "&7Deleted TextChannel!"
      Failure: "&7Failed to delete TextChannel!"
    Rename:
      Success: "&7Renamed TextChannel!"
      Failure: "&7Failed to rename TextChannel!"

  VoiceChannel:
    DoNothing:
      Success: "&7VoiceChannel change not required!"
      Failure: "&7Failed to do nothing!"
    Remove:
      Success: "&7Removed VoiceChannel!"
      Failure: "&7Failed to remove VoiceChannel!"
    Add:
      Success: "&7Added VoiceChannel!"
      Failure: "&7Failed to add VoiceChannel!"
    Create:
      Success: "&7Created VoiceChannel!"
      Failure: "&7Failed to create VoiceChannel!"
    Delete:
      Success: "&7Deleted VoiceChannel!"
      Failure: "&7Failed to delete VoiceChannel!"
    Rename:
      Success: "&7Renamed VoiceChannel!"
      Failure: "&7Failed to rename VoiceChannel!"
